<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Correção da Hora</title>
<style>
:root{--bg:#0b0b12;--card:#14141f;--line:#23233a;--tx:#f4f4fb;--mut:#8b8ba7;--a:#7c5cff;--b:#22d3ee;--ok:#34d399;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#2a1f66 0%,transparent 60%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;padding:max(20px,env(safe-area-inset-top)) 20px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-weight:700;letter-spacing:.3px}.brand small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px}
.now{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px}
.hero{background:linear-gradient(160deg,#1c1740,#14141f 60%);border:1px solid var(--line);border-radius:28px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px -20px #7c5cff55}
.lbl{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:1.6px}
.big{font-size:84px;font-weight:800;line-height:1.05;margin:8px 0 4px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:15px;min-height:22px}
.sub b{color:var(--tx)}
.bar{margin-top:22px;height:12px;border-radius:99px;background:#0e0e18;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.row .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--a);height:34px}
.ticks{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{border:1px solid var(--line);background:#1b1b2c;color:var(--tx);padding:14px;border-radius:16px;font-size:15px;font-weight:600}
button.p{background:linear-gradient(90deg,var(--a),#5b8cff);border:0}
button:active{transform:scale(.98)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:13px;background:transparent;font-weight:500}
.chip.on{color:var(--tx);border-color:var(--a);background:#7c5cff22}
.tl{margin-top:16px;display:grid;gap:8px}
.t{display:flex;justify-content:space-between;padding:12px 14px;border-radius:14px;background:#10101a;border:1px solid var(--line);font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.t.me{border-color:var(--a);color:var(--tx);background:#7c5cff1a}
.foot{margin-top:18px;text-align:center;color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-bottom:6px}
.tag.ok{background:#34d39922;color:var(--ok)}.tag.w{background:#fbbf2422;color:var(--warn)}.tag.go{background:#22d3ee22;color:var(--b)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Correção da Hora<small>Sua saída, sem conta de cabeça</small></div>
    <div class="now" id="now">--:--</div>
  </div>

  <section class="hero">
    <div class="lbl">Você sai às</div>
    <div class="big" id="saida">--:--</div>
    <div class="sub" id="sub"></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="ends"><span id="e1">--:--</span><span id="e2">--:--</span></div>
  </section>

  <section class="card">
    <div class="row"><span class="lbl">Hora que entrei</span><span class="v" id="entrada">08:00</span></div>
    <input type="range" id="sl" min="360" max="600" step="5" value="480" aria-label="Hora de entrada">
    <div class="ticks"><span>06:00</span><span>08:00</span><span>10:00</span></div>
    <div class="chips" id="chips"></div>
    <div class="btns">
      <button id="btnAgora">Entrei agora</button>
      <button class="p" id="btnSalvar">Salvar entrada de hoje</button>
    </div>
  </section>

  <section class="card">
    <div class="lbl">Tabela de entradas e saídas</div>
    <div class="tl" id="tl"></div>
  </section>

  <div class="foot">Regra: entrada entre 06:00 e 10:00 · jornada fixa de 10h, sem almoço descontado</div>
</div>

<script>
/* Regras em bloco separado da tela (migrar para config depois) */
const REGRA = { padrao: 480, min: 360, max: 600, jornada: 600 }; // minutos desde 00:00
const fmt = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const saidaDe = e => Math.min(Math.max(e, REGRA.min), REGRA.max) + REGRA.jornada;
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };

const $ = id => document.getElementById(id);
let entrada = REGRA.padrao;
const KEY = 'correcao-da-hora';
try { const s = JSON.parse(localStorage.getItem(KEY)||'null'); if (s && s.dia === new Date().toDateString()) entrada = s.entrada; } catch(e){}

function arredonda(m){ return Math.round(m/5)*5; }

function render(){
  const sai = saidaDe(entrada), agora = nowMin();
  $('entrada').textContent = fmt(entrada);
  $('saida').textContent = fmt(sai);
  $('sl').value = entrada;
  $('e1').textContent = fmt(entrada);
  $('e2').textContent = fmt(sai);

  const pct = Math.max(0, Math.min(100, (agora - entrada) / REGRA.jornada * 100));
  $('prog').style.width = pct + '%';

  let tag, txt;
  const delta = entrada - REGRA.padrao;
  if (agora >= sai) { tag = '<span class="tag ok">Jornada completa</span>'; txt = 'Pode ir embora'; }
  else if (agora < entrada) { tag = '<span class="tag go">Simulação</span>'; txt = 'Se entrar às <b>' + fmt(entrada) + '</b>, sai às <b>' + fmt(sai) + '</b>'; }
  else { const f = sai - agora; tag = '<span class="tag w">Em andamento</span>'; txt = 'Faltam <b>' + Math.floor(f/60) + 'h' + String(f%60).padStart(2,'0') + '</b> para sair'; }
  const nota = delta === 0 ? 'Horário padrão' : (delta < 0 ? Math.abs(delta)/60 + 'h mais cedo' : delta/60 + 'h mais tarde');
  $('sub').innerHTML = tag + '<br>' + txt + (delta !== 0 ? ' · ' + (Math.abs(delta)%60===0 ? nota : (delta<0?'cedo':'tarde')) : '');

  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.m === entrada));
  document.querySelectorAll('.t').forEach(t => t.classList.toggle('me', +t.dataset.m === entrada));
  $('now').textContent = fmt(agora);
}

// atalhos
const chips = $('chips');
[360, 420, 480, 540, 600].forEach(m => {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.m = m; b.textContent = fmt(m);
  b.onclick = () => { entrada = m; render(); }; chips.appendChild(b);
});
// tabela
const tl = $('tl');
[360, 390, 420, 450, 480, 510, 540, 570, 600].forEach(m => {
  const d = document.createElement('div'); d.className = 't'; d.dataset.m = m;
  d.innerHTML = '<span>Entrada ' + fmt(m) + '</span><span>Saída ' + fmt(saidaDe(m)) + '</span>';
  d.onclick = () => { entrada = m; render(); }; tl.appendChild(d);
});

$('sl').oninput = e => { entrada = arredonda(+e.target.value); render(); };
$('btnAgora').onclick = () => { entrada = Math.min(Math.max(arredonda(nowMin()), REGRA.min), REGRA.max); render(); };
$('btnSalvar').onclick = () => {
  localStorage.setItem(KEY, JSON.stringify({ dia: new Date().toDateString(), entrada }));
  $('btnSalvar').textContent = 'Salvo ✓'; setTimeout(() => $('btnSalvar').textContent = 'Salvar entrada de hoje', 1500);
};
render(); setInterval(render, 30000);
</script>
</body>
</html>
